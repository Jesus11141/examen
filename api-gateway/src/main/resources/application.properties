spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.routes[0].id=ventas
spring.cloud.gateway.routes[0].uri=lb://ventas
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/ventas/**

spring.cloud.gateway.routes[1].id=inventario
spring.cloud.gateway.routes[1].uri=lb://inventario
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/inventario/**
